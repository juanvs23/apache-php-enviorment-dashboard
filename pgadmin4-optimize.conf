# ============================================================================
# pgAdmin4 — Optimización para Apache
# ============================================================================
# Incluir este archivo en el VirtualHost del dashboard para mejorar pgAdmin4.
#
# Uso:
#   sudo cp pgadmin4-optimize.conf /etc/apache2/conf-available/
#   sudo a2enconf pgadmin4-optimize
#   sudo systemctl reload apache2
#
# Requisitos:
#   - mod_wsgi (ya instalado si pgAdmin4 funciona)
#   - mod_proxy + mod_proxy_http (para proxy reverso)
# ============================================================================

# ── 1. WSGI: más procesos y threads para entornos con carga ────────────────
# Por defecto pgAdmin4 usa 1 proceso con ~5 threads.
# Con 4 procesos × 15 threads = 60 conexiones simultáneas.
<IfModule mod_wsgi.c>
    WSGIDaemonProcess pgadmin processes=4 threads=15 display-name=%{GROUP} \
        python-home=/opt/pgadmin4/venv \
        python-path=/opt/pgadmin4/web
</IfModule>

# ── 2. Proxy reverso: servir pgAdmin4 bajo el mismo dominio ─────────────────
# En vez de un Location separado con montaje WSGI, usamos ProxyPass.
# Ventaja: comparte HTTPS, autenticación y reglas de acceso con el dashboard.
<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyPass /pgadmin4/ http://127.0.0.1:5050/
    ProxyPassReverse /pgadmin4/ http://127.0.0.1:5050/
</IfModule>
